ent district along the Parkway with shops, restaurants, rides and a choreographed fountain show. The giant observation wheel gives a great view of the mountains, especially at sunset.",tips:["Entry and parking are free; rides and the wheel are paid.","Time your visit for the fountain show after dark.","Weeknights are much quieter than weekends."],time:"2 to 3 hours",cost:"Free to enter",url:"https://islandinpigeonforge.com"},{name:"Anakeesta",cat:"Attractions",lat:35.7117,lon:-83.518,pick:!1,note:"Mountaintop park in downtown Gatlinburg with a treetop skywalk and big views.",about:"Ride up from downtown Gatlinburg to a mountaintop village with a treetop skywalk, gardens, a mountain coaster and some of the best views over the Smokies.",tips:["Go on a clear day for the long views.","Downtown Gatlinburg parking fills early, so arrive in the morning.","Stay until dusk when the lights come on."],time:"Half day",cost:"Paid tickets",url:"https://anakeesta.com"},{name:"Sugarlands Visitor Center",cat:"Outdoors",lat:35.6853,lon:-83.5367,pick:!0,note:"The front door to Great Smoky Mountains National Park. Grab trail maps here.",about:"The main visitor center on the Tennessee side of the national park, with exhibits on the park's wildlife, a short film, rangers to suggest hikes and current trail and road conditions.",tips:["Ask a ranger which trails suit your group and the weather.","Walk the easy trail to Cataract Falls right from the center.",bl],time:"About 1 hour",cost:"Free (parking tag)",url:"https://www.nps.gov/grsm/"},{name:"Laurel Falls Trail",cat:"Outdoors",lat:35.6787,lon:-83.596,pick:!1,note:"A paved 2.6-mile round trip to an 80-foot waterfall. Go early, parking fills fast.",about:"One of the most popular hikes in the Smokies: a paved path climbing gently through the forest to a two-tier waterfall. It's a good first hike for families.",tips:["Check the park website for closures before you go.","Arrive early or late in the day for parking.","The path is paved but steep in places and has drop-offs, so hold small hands.",bl],time:"About 2 hours",cost:"Free (parking tag)",url:"https://www.nps.gov/grsm/"},{name:"Kuwohi (Clingmans Dome)",cat:"Outdoors",lat:35.5628,lon:-83.4985,pick:!1,note:"The highest point in the Smokies, with an observation tower above the clouds.",about:"At 6,643 feet this is the highest peak in the park and in Tennessee. A steep half-mile paved walk leads to an observation tower with views across several states on a clear day. It was officially renamed Kuwohi, its Cherokee name, in 2024.",tips:["The road is closed in winter, roughly December through March.","It's often 10 to 20 degrees cooler than town, so bring a jacket.","Sunset from the tower is unforgettable; bring a flashlight for the walk down.",bl],time:"Half day with the drive",cost:"Free (parking tag)",url:"https://www.nps.gov/grsm/"},{name:"Douglas Lake",cat:"Outdoors",lat:35.965,lon:-83.43,pick:!1,note:"Boating, fishing and quiet coves. Marinas rent pontoons by the half day.",about:"A big reservoir on the French Broad River with mountain views, quiet coves and good fishing for bass and crappie. Marinas around the lake rent pontoons and kayaks.",tips:["Water levels drop in late fall and winter, so check before planning boat time.","Book pontoons ahead on summer weekends.","Sunset from the water is the best part of the day."],time:"Half day",cost:"Rentals vary"},{name:"Applewood Farmhouse Restaurant",cat:"Eat & drink",lat:35.8433,lon:-83.5726,pick:!0,note:"Southern breakfast with apple fritters and apple butter. Expect a short wait on weekends.",about:"A farmhouse-style restaurant beside an apple orchard, known for warm apple fritters with apple butter, apple julep and big Southern breakfasts. The orchard shops and cider mill next door are worth a wander.",tips:["Go on a weekday morning to skip the wait.","Save room for the fritters; they come with every meal.","Pick up apple butter to take home."],time:"About 1 hour",cost:"$$"},{name:"The Old Mill",ca
